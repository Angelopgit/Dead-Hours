name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Redis for the multi-server check
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check
      - run: npm run build
