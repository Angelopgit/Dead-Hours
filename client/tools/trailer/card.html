<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trailer card</title>
    <style>
      /* The game's own typefaces (client/src/ui/styles.css loads the same files through @fontsource). */
      @font-face { font-family: 'Oswald'; font-weight: 300; src: url('../../../node_modules/@fontsource/oswald/files/oswald-latin-300-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Oswald'; font-weight: 500; src: url('../../../node_modules/@fontsource/oswald/files/oswald-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 400; src: url('../../../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 500; src: url('../../../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2'); }
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: transparent; }
      body { font-family: 'Oswald', 'Arial Narrow', sans-serif; color: #ece6dc; -webkit-font-smoothing: antialiased; }
      .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      /* A feature line over the footage: a soft dark band so it reads over lamps and fire. */
      .feature { justify-content: flex-end; padding-bottom: 92px;
        background: linear-gradient(to top, rgba(4, 6, 10, 0.72) 0%, rgba(4, 6, 10, 0.42) 22%, rgba(4, 6, 10, 0) 46%); }
      .feature h2 { margin: 0; font-weight: 500; font-size: 58px; letter-spacing: 0.26em; text-indent: 0.26em; line-height: 1.1;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85), 0 0 36px rgba(0, 0, 0, 0.6); }
      .feature .sub { margin-top: 14px; font-weight: 300; font-size: 24px; letter-spacing: 0.34em; text-indent: 0.34em; color: #c9c2b6;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9); }
      .feature .rule { width: 72px; height: 2px; background: #b9412f; margin: 0 auto 22px; box-shadow: 0 0 12px rgba(185, 65, 47, 0.7); }
      /* The opening line: a small kicker, like the game's area notices. */
      .open { justify-content: flex-end; padding-bottom: 150px; }
      .open h2 { margin: 0; font-weight: 300; font-size: 30px; letter-spacing: 0.5em; text-indent: 0.5em; color: #d9d2c6;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9); }
      /* The title over black, like the main menu's. */
      .title { background: #000; }
      .title h1 { margin: 0; font-weight: 500; font-size: 150px; letter-spacing: 0.22em; text-indent: 0.22em; line-height: 1;
        text-shadow: 0 0 40px rgba(220, 70, 50, 0.22), 0 4px 18px rgba(0, 0, 0, 0.6); }
      .title .sub { margin-top: 26px; font-weight: 300; font-size: 30px; letter-spacing: 0.4em; text-indent: 0.4em; color: #a8a096; }
      .cta { background: #000; }
      .cta h2 { margin: 0; font-weight: 500; font-size: 64px; letter-spacing: 0.26em; text-indent: 0.26em; }
      .cta .sub { margin-top: 20px; font-weight: 300; font-size: 26px; letter-spacing: 0.36em; text-indent: 0.36em; color: #b3ab9f; }
      .cta .url { margin-top: 44px; font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 30px; letter-spacing: 0.08em; color: #e8b9a8; }
      .cta .rule { width: 90px; height: 2px; background: #b9412f; margin: 26px auto 0; box-shadow: 0 0 12px rgba(185, 65, 47, 0.7); }
    </style>
  </head>
  <body>
    <script>
      const q = new URLSearchParams(location.search);
      const kind = q.get('kind') ?? 'feature';
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
      const title = esc(q.get('title') ?? '');
      const sub = esc(q.get('sub') ?? '');
      const url = esc(q.get('url') ?? '');
      let html = '';
      if (kind === 'feature') html = `<div class="card feature"><div class="rule"></div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
      else if (kind === 'open') html = `<div class="card open"><h2>${title}</h2></div>`;
      else if (kind === 'title') html = `<div class="card title"><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
      else html = `<div class="card cta"><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}<div class="rule"></div>${url ? `<div class="url">${url}</div>` : ''}</div>`;
      document.body.innerHTML = html;
      document.fonts.ready.then(() => { window.__cardReady = true; });
    </script>
  </body>
</html>
